[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indbw"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformer_lens",
    # transformer_lens's neox weight conversion hardcodes GPTNeoXForCausalLM's
    # head as `embed_out`; transformers renamed it to `lm_head` after 5.9.0
    # (transformer_lens's own declared floor), breaking Pythia loading on an
    # unpinned install. Pinned to the last version confirmed to still have
    # `embed_out` — see PROJECT.md decisions log.
    "transformers==5.9.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
