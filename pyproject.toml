[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indbw"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    # <3.7.1 lacks a fix present in some (but not all) of its checkpoint-
    # loading branches; the pythia branch itself is still unguarded even at
    # 3.7.1 -- see the get_token_to_send workaround in models.py. Floor, not
    # pin: newer releases are fine, an older resolution is not.
    "transformer_lens>=3.7.1",
    # transformer_lens's neox weight conversion hardcodes GPTNeoXForCausalLM's
    # head as `embed_out`; transformers renamed it to `lm_head` after 5.9.0
    # (transformer_lens's own declared floor), breaking Pythia loading on an
    # unpinned install. Pinned to the last version confirmed to still have
    # `embed_out` — see PROJECT.md decisions log.
    "transformers==5.9.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    # Pinned, not floated. CI installs from this file and runs `ruff
    # check`/`ruff format --check` as a tier-0 gate, so any ruff release
    # that adds a rule or changes formatting turns the build red on code
    # nobody touched -- which has already cost this repo two "Fix CI"
    # commits, and would have cost a third when ruff started reporting
    # E402 on the sys.path-then-import pattern below. Bump deliberately.
    "ruff==0.15.8",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# scripts/ is not an installed package, so importing a script module (or
# indbw itself, from a script) requires a sys.path insert first, and the
# import therefore cannot be at the top of the file. E402 is unavoidable
# in exactly these files and nowhere else -- listed one by one rather
# than blanket-ignored per directory, so a genuinely misplaced import in
# a new file still fails the gate.
"scripts/check_metric_hash.py" = ["E402"]
"scripts/run_g3.py" = ["E402"]
"scripts/run_sweep.py" = ["E402"]
"tests/unit/test_analyze_training_budget.py" = ["E402"]
"tests/unit/test_diagnose_g3_reachability.py" = ["E402"]
"tests/unit/test_g0_sweep.py" = ["E402"]
"tests/unit/test_run_g3.py" = ["E402"]
"tests/unit/test_run_sweep.py" = ["E402"]
# A one-line lambda naming the comparison under test reads better than a
# def here; the rule is about shadowing/readability in production code.
"tests/unit/test_nulls.py" = ["E731"]

[tool.mypy]
python_version = "3.11"
strict = true
