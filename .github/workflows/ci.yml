name: ci

on:
  push:
  workflow_dispatch:

jobs:
  tier0-lint-and-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/indbw
      # Metric-hash check (CLAUDE.md tier 0): fails if a metric
      # definition in probes.py or algebra.py changed without a
      # METRIC_VERSION bump. Mechanism and what counts as a change:
      # src/indbw/metric_hash.py; baseline: metric_hash.json.
      - run: python scripts/check_metric_hash.py
      # Same mechanism for the selective-LoRA metric surface (SELORA_METRIC_VERSION).
      - run: python scripts/check_selora_metric_hash.py

  tier1-unit:
    runs-on: ubuntu-latest
    needs: tier0-lint-and-hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  tier2-property-and-smoke:
    runs-on: ubuntu-latest
    needs: tier1-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # CLAUDE.md tier 2 is "tests/property + fixture-model tests +
      # smoke test". tests/smoke runs the whole path end to end on a
      # randomly-initialized model so integration breakage surfaces here
      # rather than three hours into a real run.
      - run: pytest tests/property tests/smoke -q

  tier2-design:
    runs-on: ubuntu-latest
    needs: tier1-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Extension S design simulations (STATE.md practice 1): type-I at the null boundary
      # and power under prereg.ASSUMPTIONS for every registered procedure. ~2 min, so it
      # runs beside tier 2 rather than inside tier 1's 30 s budget.
      - run: pytest tests/design -q

  tier2_5-schema-and-verdicts:
    runs-on: ubuntu-latest
    needs: tier2-property-and-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Runs over every results record in the repo, not just new ones —
      # a metric-version bump or criterion edit surfaces as a failure on
      # all affected historical records. No-op until results/ exists.
      - run: |
          if [ -d results ]; then
            pytest tests/schema -q
          else
            echo "no results/ directory yet — nothing to validate"
          fi

  tier3-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration -q
