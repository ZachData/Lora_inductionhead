repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        additional_dependencies: []

  # Metric-hash check (CLAUDE.md, "Hygiene" — "so a wasted CI cycle
  # costs seconds instead of minutes"). Same gate CI tier 0 runs.
  - repo: local
    hooks:
      - id: metric-hash
        name: metric-hash check (METRIC_VERSION vs. algebra.py/probes.py)
        entry: python scripts/check_metric_hash.py
        language: system
        pass_filenames: false
        files: ^(src/indbw/(algebra|probes|schema)\.py|metric_hash\.json)$
